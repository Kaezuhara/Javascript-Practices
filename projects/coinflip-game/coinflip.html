<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinflip</title>
  <link rel="stylesheet" href="coinflip.css">
</head>
<body>
  <!--Coin/Flip Title-->
  <div class="titleCont">
    <h1 class="coinTitle">COIN</h1>
    <h1 class="slashTitle">/</h1>
    <h1 class="flipTitle">FLIP</h1>
  </div>

  <!--Toss Button-->
  <div class="tossCont">
    <div class="imgCont toss">
      <img src="images/toss-coin.png">
    </div>
    <h3>Toss it!</h3>
  </div>


  <!--Heads & Tails Buttons Row-->
  <div class="choicesCont">

    <!--Heads Button Column-->
    <div class="choicesCol">
      <div class="imgCont heads">
        <img src="images/front-coin.png">
      </div>
      <h3>Heads</p>
    </div>

    <!--Tails Button Column-->
    <div class="choicesCol">
      <div class="imgCont tails">
        <img src="images/back-coin.png">
      </div>
      <h3>Tails</p>
    </div>

  </div>

  <!--Score Section & Reset Button-->
  <div class="scoreCont">
    <h2>Guesses</h2>
    <p class="scoreDisp"></p>
    <button class="reset">Reset</button>
  </div>

  <!--Status Row-->
  <div class="statusCont">
    <p class="statusFeedback">Toss the coin to start.</p>
  </div>

  <script src="coinflip.js"></script>
</body>
</html>
