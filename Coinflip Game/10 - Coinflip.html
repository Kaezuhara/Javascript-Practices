<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinflip</title>
  <link rel="stylesheet" href="10 - Coinflip.css">
</head>
<body>
  <div class="titleCont">
    <h1 class="coinTitle">COIN</h1>
    <h1 class="slashTitle">/</h1>
    <h1 class="flipTitle">FLIP</h1>
  </div>

  <div class="tossCont">
    <div class="imgCont" onclick="toss()">
      <img src="images/Toss Coin.png">
    </div>
    <h3>Toss it!</h3>
  </div>



  <div class="choicesCont">
    
    <div class="choicesCol">
      <div class="imgCont" onclick="guessHeads()">
        <img src="images/Front Coin.png">
      </div>
      <h3>Heads</p>
    </div>

    <div class="choicesCol">
      <div class="imgCont" onclick="guessTails()">
        <img src="images/Back Coin.png">
      </div>
      <h3>Tails</p>
    </div>

  </div>

  <div class="scoreCont">
    <h2>Guesses</h2>
    <p class="scoreDisp">Win: Lose:</p>
  </div>

  <div class="statusCont">
    <p class="status">Toss the coin to start.</p>
  </div>

  <script src="10 - Coinflip.js"></script>
</body>
</html>
