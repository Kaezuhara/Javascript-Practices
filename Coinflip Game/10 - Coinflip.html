<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinflip</title>
  <link rel="stylesheet" href="10 - Coinflip.css">
  <link rel="stylesheet" href="10 - Coinflip.js">
</head>
<body>
  <div class="titleCont">
    <h1 class="coinTitle">COIN</h1>
    <h1 class="slashTitle">/</h1>
    <h1 class="flipTitle">FLIP</h1>
  </div>

  <div class="choicesCont">
    
    <div class="choicesCol">
      <div class="imgCont">
        <img src="images\Front Coin.png">
      </div>
      <h3>Heads</p>
    </div>

    <div class="choicesCol">
      <div class="imgCont">
        <img src="images\Back Coin.png">
      </div>
      <h3>Tails</p>
    </div>

  </div>

  <h2>You vs Computer</h2>
  <div class="score">
    <p class="win">Win: </p>
    <p class="lose">Lose: </p>
    <p class="tie">Tie: </p>
  </div>
</body>
</html>
